[project]
name = "agw-gateway"
version = "0.1.0"
description = "AI agent audit gateway: enforcement point (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "agw-schemas",
    "prometheus-client>=0.21",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "minio>=7.2,<8",
    "httpx>=0.27",
]

[tool.uv.sources]
agw-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agw_gateway"]
