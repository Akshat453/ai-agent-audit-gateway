[project]
name = "agw-worker"
version = "0.1.0"
description = "AGW long-running jobs (outbox executor + reconciler; later sealing, anchoring, monitoring)"
requires-python = ">=3.12"
dependencies = ["agw-gateway", "agw-schemas"]

[tool.uv.sources]
agw-gateway = { workspace = true }
agw-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agw_worker"]
