[project]
name = "agw-worker"
version = "0.1.0"
description = "AGW long-running jobs (outbox executor + reconciler; later sealing, anchoring, monitoring)"
requires-python = ">=3.12"
dependencies = [
    "agw-gateway",
    "agw-schemas",
    "agw-verifier",  # Phase 9: the monitor runs the INDEPENDENT verifier over live exports
    "web3>=7.6,<8",
    "httpx>=0.27",
]

[tool.uv.sources]
agw-gateway = { workspace = true }
agw-schemas = { workspace = true }
agw-verifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agw_worker"]
