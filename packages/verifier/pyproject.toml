[project]
name = "agw-verifier"
version = "0.1.0"
description = "Standalone AGW evidence verifier. Stdlib only; must not import apps/* or agw_schemas."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Phase 7: open disclosure bundles (HPKE X25519 + AES-256-GCM). The core verifier stays stdlib-only.
disclosure = ["cryptography>=46"]

[project.scripts]
agw-verify = "agw_verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agw_verifier"]
