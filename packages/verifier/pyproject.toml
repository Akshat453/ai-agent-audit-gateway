[project]
name = "agw-verifier"
version = "0.1.0"
description = "Standalone AGW evidence verifier (Phase 7). Must not import apps/*."
requires-python = ">=3.12"
dependencies = ["agw-schemas"]

[tool.uv.sources]
agw-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agw_verifier"]
