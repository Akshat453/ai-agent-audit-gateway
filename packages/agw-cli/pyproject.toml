[project]
name = "agw-cli"
version = "0.1.0"
description = "AgentGuard CLI: one vendor-neutral pre-action hook for coding agents (Claude Code, Codex, Cursor, Gemini CLI, MCP)"
requires-python = ">=3.11"
# Standard library only: one `pipx install` with nothing to resolve, and no third-party code
# on the developer's hook path (every agent action runs through this process).
dependencies = []

[project.scripts]
agw = "agw_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agw_cli"]
