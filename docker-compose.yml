name: agw

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AGW_MIGRATOR_PASSWORD: ${AGW_MIGRATOR_PASSWORD:?set AGW_MIGRATOR_PASSWORD in .env}
      AGW_APP_PASSWORD: ${AGW_APP_PASSWORD:?set AGW_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AGW_PG_HOST_PORT:-54329}:5432"
    volumes:
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/docker/postgres/roles.sql:/agw/roles.sql:ro
      - agw-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Healthy only once the init script has created the runtime role.
      test: ["CMD-SHELL", "psql -U postgres -d agw -tAc \"SELECT 1 FROM pg_roles WHERE rolname='agw_app'\" | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Phase 6 (ADR-0028): local chain for anchoring. Pinned Foundry image.
  # Phase 10 (ADR-0032): the chain state persists in the agw-anvil volume (loaded on start,
  # written every 2 s and on stop), so `make stop` / `make start` keeps the contract and the
  # anchors a tenant is pinned to. `make down` (-v) still wipes it.
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.3.5
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1", "--silent",
              "--state", "/home/foundry/anvil-state.json", "--state-interval", "2"]
    volumes:
      - agw-anvil:/home/foundry   # mounted on the image's foundry-owned home, so it is writable
    ports:
      - "127.0.0.1:${AGW_ANVIL_HOST_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Phase 7 (ADR-0029): object storage for large payload CIPHERTEXTS only. MinIO's own images
  # are no longer pullable anonymously; this is Chainguard's MinIO build, pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:18c8fa28697b25e0f34c6faae171079e88a03efb8e76a21d3b5d07b4e3cbef3e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${AGW_BLOB_ACCESS_KEY:?set AGW_BLOB_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${AGW_BLOB_SECRET_KEY:?set AGW_BLOB_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${AGW_MINIO_HOST_PORT:-9000}:9000"
    volumes:
      - agw-blobs:/data

  # Phase 8 (ADR-0030): SMTP sink for the approved-write tool send_email_smtp. Pinned by digest.
  # The relay credential lives only in the gateway's environment (AGW_SMTP_PASSWORD[_FILE]).
  mailpit:
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${AGW_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${AGW_MAILPIT_HTTP_PORT:-8025}:8025"

  # ------------------------------------------------------------------ Phase 9: profile "ui"
  # `docker compose --profile ui up --build`: the whole stack in containers (database agw_ui in
  # the same Postgres), the Phase 8 demo replayed against it, and the dashboard on
  # http://localhost:3000. Secrets/keys live in the private ui-state volume.
  ui-init:
    profiles: ["ui"]
    build: { context: ., dockerfile: infra/docker/gateway/Dockerfile, target: runtime }
    command: ["bash", "/app/infra/docker/ui/init.sh"]
    environment: &ui-env
      # (":-" not ":?": compose interpolates every profile; the containers fail closed instead)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AGW_MIGRATOR_PASSWORD: ${AGW_MIGRATOR_PASSWORD:-}
      AGW_APP_PASSWORD: ${AGW_APP_PASSWORD:-}
      AGW_BLOB_ACCESS_KEY: ${AGW_BLOB_ACCESS_KEY:-}
      AGW_BLOB_SECRET_KEY: ${AGW_BLOB_SECRET_KEY:-}
      AGW_UI_DEMO_PASSWORD: ${AGW_UI_DEMO_PASSWORD:-}
      AGW_ENV: dev
      AGW_EXECUTOR_MODE: worker
      # Self-service sign-up on /signup (dev only; the gateway refuses it outside dev/test).
      AGW_SIGNUP_ENABLED: "true"
      # CRITICAL actions need two DIFFERENT approvers ("four-eyes"). false = one approver.
      AGW_APPROVAL_FOUR_EYES_CRITICAL: ${AGW_APPROVAL_FOUR_EYES_CRITICAL:-true}
      # How long a password re-check ("step-up") stays valid for admin changes / CRITICAL
      # approvals. 1800 s = 30 min (gateway default 300 s; max 3600).
      AGW_STEP_UP_WINDOW_SECONDS: ${AGW_STEP_UP_WINDOW_SECONDS:-1800}
      # Coding agents: "balanced" (default: everyday local work runs and is recorded; strict
      # checks when a change is submitted) or "strict" (C1: ask at every sensitive step).
      AGW_CODING_POLICY_PROFILE: ${AGW_CODING_POLICY_PROFILE:-balanced}
      # C2/C3: the gateway's address as seen from this Mac (agw login, agents' MCP endpoint
      # <url>/mcp, GitHub App redirects). Set it to your tunnel's https URL for GitHub webhooks.
      AGW_PUBLIC_URL: ${AGW_PUBLIC_URL:-http://localhost:8088}
      AGW_CODING_DASHBOARD_URL: ${AGW_DASHBOARD_PUBLIC_URL:-http://localhost:3000}
      # 1 = seed the "demo" tenant (alice, bob, audrey, adam) and replay the Phase 8 demo;
      # 0 = start empty and create your own tenant on /signup.
      AGW_UI_SEED_DEMO: ${AGW_UI_SEED_DEMO:-1}
    volumes: ["ui-state:/var/lib/agw"]
    depends_on:
      postgres: { condition: service_healthy }
      anvil: { condition: service_healthy }

  ui-gateway:
    profiles: ["ui"]
    build: { context: ., dockerfile: infra/docker/gateway/Dockerfile, target: runtime }
    command: ["bash", "/app/infra/docker/ui/serve.sh", "gateway"]
    environment: *ui-env
    volumes: ["ui-state:/var/lib/agw", "ui-sandbox:/var/lib/agw-sandbox"]
    ports:
      - "127.0.0.1:${AGW_GATEWAY_HOST_PORT:-8088}:8080"
    depends_on: { ui-init: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/ready')"]
      interval: 2s
      retries: 60

  ui-worker:
    profiles: ["ui"]
    build: { context: ., dockerfile: infra/docker/gateway/Dockerfile, target: runtime }
    command: ["bash", "/app/infra/docker/ui/serve.sh", "worker"]
    environment: *ui-env
    volumes: ["ui-state:/var/lib/agw", "ui-sandbox:/var/lib/agw-sandbox"]
    depends_on: { ui-gateway: { condition: service_healthy } }

  ui-provision:
    profiles: ["ui"]
    build: { context: ., dockerfile: infra/docker/gateway/Dockerfile, target: runtime }
    command: ["bash", "/app/infra/docker/ui/provision.sh"]
    environment: *ui-env
    volumes: ["ui-state:/var/lib/agw"]
    depends_on: { ui-gateway: { condition: service_healthy } }

  ui-mcp:
    profiles: ["ui"]
    build: { context: ., dockerfile: infra/docker/gateway/Dockerfile, target: runtime }
    command: ["bash", "/app/infra/docker/ui/serve.sh", "mcp"]
    environment: *ui-env
    volumes: ["ui-state:/var/lib/agw"]
    depends_on: { ui-gateway: { condition: service_healthy } }

  ui-demo:
    profiles: ["ui"]
    build: { context: ., dockerfile: infra/docker/gateway/Dockerfile, target: runtime }
    command: ["bash", "/app/infra/docker/ui/demo.sh"]
    environment: *ui-env
    volumes: ["ui-state:/var/lib/agw"]
    depends_on:
      ui-gateway: { condition: service_healthy }
      ui-worker: { condition: service_started }
      ui-mcp: { condition: service_started }

  ui-dashboard:
    profiles: ["ui"]
    build: { context: apps/dashboard }
    environment:
      AGW_GATEWAY_URL: http://ui-gateway:8080
      AGW_DASHBOARD_SECRET: ${AGW_DASHBOARD_SECRET:-}  # < 32 chars -> every request fails closed
    ports:
      - "127.0.0.1:${AGW_DASHBOARD_HOST_PORT:-3000}:3000"
    depends_on: { ui-gateway: { condition: service_healthy } }

  # ------------------------------------------------------------------ Phase 9: profile "monitoring"
  # Prometheus scraping the host gateway (/metrics) and the worker metrics port; Grafana with the
  # provisioned AGW dashboard (infra/grafana). `docker compose --profile monitoring up -d`.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996  # v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:${AGW_PROMETHEUS_HOST_PORT:-9090}:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d  # 12.1.1
    entrypoint: ["sh", "-c", 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "set AGW_GRAFANA_ADMIN_PASSWORD in .env"; exit 1; }; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${AGW_GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${AGW_GRAFANA_HOST_PORT:-3001}:3000"]
    depends_on: [prometheus]

volumes:
  ui-state:
  ui-sandbox:
  agw-pgdata:
  agw-blobs:
  agw-anvil:
